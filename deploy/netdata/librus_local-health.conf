# Librus owned health templates. Values are current collector dimensions.
# Thresholds are evaluated every minute. State changes notify; repeats are disabled.

template: librus_full_sync_stale
      on: librus_local.sync
   class: Errors
    type: Other
component: Librus
    calc: $success_alert_age
   units: minutes
   every: 60s
    warn: $this > 90
    crit: $this > 150
  repeat: off
    info: Time since last fully successful synchronization; intentional pause suppresses this alert
      to: sysadmin

template: librus_sync_failures
      on: librus_local.sync
   class: Errors
    type: Other
component: Librus
    calc: $failures
   units: failures
   every: 60s
    warn: $this >= 1
    crit: $this >= 2
  repeat: off
    info: First failed run warns; two consecutive failed runs are critical
      to: sysadmin

template: librus_sync_runtime
      on: librus_local.sync
   class: Errors
    type: Other
component: Librus
    calc: $running_minutes
   units: minutes
   every: 60s
    warn: $this > 30
    crit: $this >= 45
  repeat: off
    info: Synchronization exceeded its normal runtime or the 45 minute timeout
      to: sysadmin

template: librus_sync_interrupted
      on: librus_local.sync
   class: Errors
    type: Other
component: Librus
    calc: $interrupted
   units: state
   every: 60s
    crit: $this > 0
  repeat: off
    info: Synchronization was interrupted, killed or timed out; investigate before retrying writes
      to: sysadmin

template: librus_unknown_calendar_write
      on: librus_local.sync
   class: Errors
    type: Other
component: Librus
    calc: $unknown
   units: writes
   every: 60s
    crit: $this > 0
  repeat: off
    info: Calendar write result is unknown after the run; reconcile before another create
      to: sysadmin

template: librus_automatic_queue_stale
      on: librus_local.queue
   class: Errors
    type: Other
component: Librus
    calc: $pending_alert_age
   units: minutes
   every: 60s
    warn: $this > 90
    crit: $this > 150
  repeat: off
    info: Automatic work is overdue; intentional write pause suppresses queue age
      to: sysadmin

template: librus_sync_timer_down
      on: librus_local.services
   class: Errors
    type: Other
component: Librus
    calc: $sync_timer_down
   units: minutes
   every: 60s
    warn: $this >= 2
    crit: $this >= 5
  repeat: off
    info: Hourly synchronization timer is disabled or unavailable
      to: sysadmin

template: librus_backup_timer_down
      on: librus_local.services
   class: Errors
    type: Other
component: Librus
    calc: $backup_timer_down
   units: minutes
   every: 60s
    warn: $this >= 2
    crit: $this >= 5
  repeat: off
    info: Daily backup timer is disabled or unavailable
      to: sysadmin

template: librus_web_down
      on: librus_local.services
   class: Errors
    type: Other
component: Librus
    calc: $web_down
   units: minutes
   every: 60s
    warn: $this >= 2
    crit: $this >= 5
  repeat: off
    info: Private authenticated application status endpoint is unavailable
      to: sysadmin

template: librus_sync_unit_missing
      on: librus_local.services
   class: Errors
    type: Other
component: Librus
    calc: $sync_unit_down
   units: minutes
   every: 60s
    warn: $this >= 2
    crit: $this >= 5
  repeat: off
    info: Synchronization unit could not be inspected; inactive oneshot is normal
      to: sysadmin

template: librus_monitor_snapshot_stale
      on: librus_local.monitoring
   class: Errors
    type: Other
component: Librus
    calc: $snapshot_age
   units: minutes
   every: 60s
    warn: $this >= 3
    crit: $this >= 5
  repeat: off
    info: Aggregate export is stale or missing; no private records are read by Netdata
      to: sysadmin

template: librus_monitor_source_invalid
      on: librus_local.monitoring
   class: Errors
    type: Other
component: Librus
    calc: $invalid_minutes
   units: minutes
   every: 60s
    warn: $this >= 3
    crit: $this >= 5
  repeat: off
    info: Aggregate export is missing, malformed or contains invalid future timestamps
      to: sysadmin

template: librus_monitor_database_down
      on: librus_local.monitoring
   class: Errors
    type: Other
component: Librus
    calc: $db_down
   units: minutes
   every: 60s
    warn: $this >= 3
    crit: $this >= 5
  repeat: off
    info: Read-only aggregate database inspection failed
      to: sysadmin

template: librus_collector_missing
      on: librus_local.monitoring
   class: Errors
    type: Other
component: Librus
    calc: ($now - $last_collected_t) / 60
   units: minutes
   every: 60s
    warn: $this >= 3
    crit: $this >= 5
  repeat: off
    info: Netdata has stopped receiving Librus collector metrics
      to: sysadmin

template: librus_backup_stale
      on: librus_local.backup
   class: Errors
    type: Other
component: Librus
    calc: $backup_age
   units: hours
   every: 60s
    warn: $this > 36
    crit: $this > 48
  repeat: off
    info: Time since last completed SQLite backup verified with integrity_check
      to: sysadmin

template: librus_backup_failed
      on: librus_local.backup
   class: Errors
    type: Other
component: Librus
    calc: $backup_failed
   units: state
   every: 60s
    warn: $this > 0
  repeat: off
    info: Last backup failed or its systemd service is unavailable
      to: sysadmin

template: librus_writes_left_paused
      on: librus_local.pause
   class: Errors
    type: Other
component: Librus
    calc: $pause_minutes
   units: minutes
   every: 60s
    warn: $this > 90
  repeat: off
    info: Calendar writes have intentionally remained paused for over 90 minutes
      to: sysadmin
